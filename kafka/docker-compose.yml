services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zookeeper.rule=Host(`zookeeper.danlutsevych.online`)"
      - "traefik.http.routers.zookeeper.entrypoints=websecure"
      - "traefik.http.routers.zookeeper.tls=true"
      - "traefik.http.routers.zookeeper.tls.certresolver=myresolver"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka.rule=Host(`kafka.danlutsevych.online`)"
      - "traefik.http.routers.kafka.entrypoints=websecure"
      - "traefik.http.routers.kafka.tls=true"
      - "traefik.http.routers.kafka.tls.certresolver=myresolver"
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka.danlutsevych.online:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
